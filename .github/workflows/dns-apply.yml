name: DNS Apply

on:
  push:
    branches: [main]
    paths:
      - "zones/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/dns-apply.yml"

permissions:
  contents: read

concurrency:
  group: dns-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - name: octoDNS apply
        env:
          GANDI_TOKEN: ${{ secrets.GANDI_TOKEN }}
        run: octodns-sync --config-file=config/octodns.yaml --doit --force
